# OneData Portal 配置文件
# 所有配置项统一在此管理

server:
  host: "0.0.0.0"
  port: 3000
  debug: false
  # 进程数：Python 单进程只能用满一个 CPU 核，建议设为服务器 CPU 核数（需开启 Redis，
  # 缓存才能在进程间共享）。注意：内存限流按进程计数，N 个进程时实际上限约为 N 倍。
  workers: 1
  secret_key: "pfk-O7OSzAYadCPEmOkjNFG1JMlpfnKcL3UH"

# 多环境 (v2.18+)：不同端口标识不同环境，同库不同表（pre 表名带 _pre 后缀）
#   - 启动端口命中某环境的 port 时自动按该环境运行（--env / APP_ENV 优先级更高）
#   - python main.py --env pre 会自动监听 pre 的端口
#   - url 用于两套环境页面互相跳转（如预发「发布到生产」后去生产查看差异/审核），
#     留空则按「当前访问的主机名 + 对方端口」推算
#   - 生产环境：仅管理员(超级管理员/管理员)可做写操作；
#     其他人请在预发环境修改，验证后「发布到生产」，由生产管理员核对差异后审核上线
environments:
  prod:
    port: 3000
    url: ""
  pre:
    port: 3002
    url: ""

database:
  # SQLite (默认开发环境)
  # url: "sqlite+aiosqlite:///./onedata.db"
  # MySQL 示例:
  url: "mysql+aiomysql://opinionhub:8drfEYnxAdcW5aP3@localhost:3306/opinionhub"
#  url: "mysql+aiomysql://BI_Analyst:Tr5Apzvat@rm-bp1t124f8.mysql.rds.alncs.com:3306/pft_ai"
  echo: false
  pool_size: 15
  pool_recycle: 3600
  max_overflow: 50

# localhost Ef2AAHEB6jxNA4ST
# 172.16.0.142 TDS.connector@123
redis:
  enabled: true
  host: "localhost"
  port: 6378
  password: "Ef2AAHEB6jxNA4ST"
  db: 0
  max_connections: 20
  key_prefix: "PFK:"

security:
  # API Key 加密密钥
  encryption_key: "ElDOTWgmNlx5sJMJRaIojkqrd4cWZmPF"
  # 默认管理员账号
  admin_username: "admin"
  admin_password: "admin123"
  # JWT
  jwt_secret: "bqYqO1g3pS5FBtjgXRHEUAhjylhl74cE"
  jwt_expire_hours: 24
  # IP 白名单 (空列表表示不限制)
  ip_whitelist: []
  # 请求体大小限制 (bytes)
  max_request_body: 1048576  # 1MB
  # 参数数组最大长度
  max_array_length: 100
  # 谁可以创建/修改插件类 API (v2.20+)。插件代码在服务进程内直接执行（可读本配置文件、执行系统命令），
  # 默认仅超级管理员；设为 developer 恢复旧行为（项目研发即可编辑）
  plugin_editor: "super_admin"

query:
  # 默认最大返回行数
  default_max_rows: 10000
  # 默认超时时间 (秒)
  default_timeout: 30
  # 业务数据源 MySQL 驱动 (v2.20+)：asyncmy（默认，C 扩展，解析结果集快 4~6 倍）/ aiomysql
  mysql_driver: "asyncmy"
  # 慢查询阈值 (毫秒)
  slow_query_threshold: 500
  # 慢查询告警阈值 (毫秒)
  slow_query_alert_threshold: 1000
  # DDL 拦截关键字
  ddl_keywords:
    - "DROP"
    - "CREATE"
    - "ALTER"
    - "TRUNCATE"
    - "INSERT"
    - "UPDATE"
    - "DELETE"
    - "GRANT"
    - "REVOKE"

cache:
  # 默认缓存 TTL (秒)
  default_ttl: 300
  # 空结果缓存 TTL (秒)
  null_ttl: 60
  # TTL 随机偏移范围 (秒), 防止缓存雪崩
  ttl_jitter: 30
  # --- 缓存自动预热 (v2.13+) ---
  # 仅对「开启了缓存 + 开启了自动预热」的 API 生效，且需要 redis.enabled: true。
  # 后台调度器扫描间隔(秒)：每轮检查快过期的缓存并提前重新查询回填
  prewarm_interval: 120
  # 单个 API 最多记住多少组请求参数(超过则淘汰最久没被请求的)
  # 参数组合越多，每轮预热要跑的查询就越多，按你的数据库承受能力调整
  prewarm_max_params: 200
  # 缓存剩余寿命低于此比例时提前刷新(仅 prewarm_strategy=near_expiry 时生效)
  prewarm_threshold_ratio: 0.2
  # 预热策略:
  #   always      每轮扫描把记录的参数组合全部刷一遍(默认)。缓存内容始终是最近
  #               一轮扫描的最新数据，扫描间隔就等于数据新鲜度上限，不受各 API
  #               自身 TTL 影响。
  #   near_expiry 只在缓存快过期时才刷，省数据库资源，但两次刷新之间缓存是旧的。
  prewarm_strategy: "always"
  # 进程内热点缓存 (v2.20+)：命中过的结果在本进程内存里再留几秒，热门 key 不必每次访问 Redis。
  # 不超过该 key 在 Redis 里的剩余寿命；手动「清除缓存」后其它进程最多延迟这么多秒。0 = 关闭
  local_ttl: 5
  # 热点缓存每个进程最多占用的内存（MB，大结果按压缩后大小计）
  local_max_mb: 256

log:
  # 日志目录
  log_dir: "./logs"
  # 日志保留天数
  retention_days: 3
  # 日志级别
  level: "INFO"
  # 全量日志文件 / 网关日志文件的级别，留空同 level (v2.19+)。
  # 之前固定为 DEBUG，每个请求写二十来条，排查问题时可临时改成 "DEBUG"
  file_level: ""
  # uvicorn 访问日志（每请求一行，与网关日志、call_logs 重复）(v2.20+)，默认关闭
  access_log: false
  # 网关每请求一条 INFO 日志 (v2.20+)。call_logs 表里有同样明细；
  # 高并发追求极限吞吐时可设为 false（实测单行查询吞吐 +45%）
  gateway_info: true
  # 异步日志队列大小
  queue_size: 10000

monitor:
  # 告警: 失败率阈值 (百分比)
  failure_rate_threshold: 10
  # 告警: 平均耗时阈值 (毫秒)
  avg_latency_threshold: 2000
  # 告警: 单次耗时阈值 (毫秒)
  single_latency_threshold: 5000
  # 指标采集间隔 (秒)
  collect_interval: 60
  # 调用日志保留天数 (v2.19+)：> 0 时每小时自动删除更早的日志（分批删除，不长时间锁表）；
  # 0 = 不自动清理。call_logs 每次调用一行、单行可达十几 KB，不清理会无限增长
  call_log_retention_days: 0
gateway:
  # API 调用地址前缀 (默认 /v1/data)
  prefix: "/v1/data"
  # 接口配置进程内缓存秒数 (v2.19+)：网关不必每个请求都查 项目/API/参数/数据源。
  # 本进程内修改配置立即生效；多 worker 时其它进程最多延迟这么多秒。0 = 关闭
  config_cache_ttl: 5
  # 响应体超过这么多字节、且客户端请求头带 Accept-Encoding: gzip 时压缩返回 (v2.20+)。
  # 缓存的结果是预压缩好的，命中时几乎没有额外开销；JSON 通常压到 1/10 左右。0 = 不压缩
  gzip_min_bytes: 8192

