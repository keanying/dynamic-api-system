{% extends "layouts/base.html" %}

{% block body %}
<div class="app-layout">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">
                    <img src="/static/img/logo.png" alt="数据开放平台" width="24" height="24" style="display:block;">
                </div>
                <span class="logo-text">数据开放平台</span>
            </div>

        </div>
        <nav class="sidebar-nav">
            <a href="/admin/dashboard" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                <span>仪表盘</span>
            </a>
            <a href="/admin/projects" class="nav-item {% if active_page == 'projects' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
                <span>项目管理</span>
            </a>
            <a href="/admin/datasources" class="nav-item {% if active_page == 'datasources' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                <span>数据资源</span>
            </a>
            <a href="/admin/users" class="nav-item {% if active_page == 'users' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                <span>用户管理</span>
            </a>
            <a href="/admin/approvals" class="nav-item {% if active_page == 'approvals' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
                <span>审批中心</span>
            </a>
            <a href="/admin/plugin-libraries" class="nav-item {% if active_page == 'plugin_libraries' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                <span>插件中心</span>
            </a>
            <a href="/admin/logs" class="nav-item {% if active_page == 'logs' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                <span>调用日志</span>
            </a>
        </nav>
        <div class="sidebar-footer" id="sidebarFooterToggle" style="cursor:pointer" title="点击收起/展开侧边栏">
            <div class="user-info">
                <div class="user-avatar">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div class="user-details">
                    <span class="user-name" id="sidebarUserName">{{ username or 'Admin' }}</span>
                    <span class="user-role" id="sidebarUserRole">—</span>
                </div>
            </div>
            <button class="btn-icon logout-btn" onclick="logout()" title="退出登录">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 顶部栏 -->
        <header class="topbar">
            <div class="breadcrumb">
                {% block breadcrumb %}{% endblock %}
            </div>
            <div class="topbar-actions">
                {% if app_env %}
                <span class="env-badge env-{{ app_env.env }}" title="不同端口对应不同环境：生产 {{ app_env.prod_port or '-' }} / 预发 {{ app_env.pre_port or '-' }}">{{ app_env.label }}</span>
                <a class="btn btn-ghost btn-sm" id="envSwitchLink" style="display:none;"></a>
                {% endif %}
                <button class="btn-icon" onclick="location.reload()" title="刷新">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                </button>
            </div>
        </header>

        <!-- 生产环境只读提示（非管理员，由 app.js 按当前用户角色显示） -->
        <div class="env-readonly-banner" id="envReadonlyBanner" style="display:none;"></div>

        <!-- 页面内容 -->
        <div class="page-content">
            <div class="page-content-inner">
                {% block content %}{% endblock %}
            </div>
        </div>
    </main>
</div>

<script>window.APP_ENV = {{ (app_env or {}) | tojson }};</script>

<!-- Toast 消息 -->
<div id="toast-container"></div>

<!-- 确认弹窗 -->
<div class="modal-overlay" id="confirmModal" style="display:none">
    <div class="modal">
        <div class="modal-header">
            <h3 id="confirmTitle">确认操作</h3>
            <button class="btn-icon" data-confirm-x onclick="closeConfirm()">&times;</button>
        </div>
        <div class="modal-body">
            <p id="confirmMessage"></p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" data-confirm-cancel onclick="closeConfirm()">取消</button>
            <button class="btn btn-danger" id="confirmBtn" data-confirm-ok onclick="doConfirm()">确认</button>
        </div>
    </div>
</div>
{% endblock %}
