{% extends "layouts/app.html" %}

{% block title %}审批中心 - OneData Portal{% endblock %}

{% block breadcrumb %}
<span class="current">审批中心</span>
{% endblock %}

{% block content %}
<div class="page-head">
    <h1>审批中心</h1>
    <div class="actions">
        <div class="seg">
            <button class="btn btn-sm" id="tabPending" onclick="switchTab('pending')">待我审批</button>
            <button class="btn btn-ghost btn-sm" id="tabMine" onclick="switchTab('mine')">我发起的</button>
        </div>
        <button class="btn btn-secondary" onclick="reload()">刷新</button>
    </div>
</div>

<div class="card">
    <div class="card-body" style="padding:0;">
        <table class="data-table" style="width:100%;">
            <thead>
                <tr>
                    <th>操作</th>
                    <th>API</th>
                    <th>项目</th>
                    <th id="colPeople">申请人</th>
                    <th>理由/备注</th>
                    <th>时间</th>
                    <th id="colAction" style="text-align:right;">处理</th>
                </tr>
            </thead>
            <tbody id="apprBody">
                <tr><td colspan="7" style="text-align:center;color:#a1a1aa;padding:24px;">加载中…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
let currentTab = 'pending';

function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabPending').className = tab === 'pending' ? 'btn btn-sm' : 'btn btn-ghost btn-sm';
    document.getElementById('tabMine').className = tab === 'mine' ? 'btn btn-sm' : 'btn btn-ghost btn-sm';
    document.getElementById('colPeople').textContent = tab === 'pending' ? '申请人' : '状态';
    document.getElementById('colAction').style.display = tab === 'pending' ? '' : 'none';
    reload();
}

function actionBadge(label) {
    const color = { '上线': '#3d5a0a', '下线': '#b45309', '删除': '#b91c1c' }[label] || '#52525b';
    return `<span style="display:inline-block;padding:2px 9px;border-radius:999px;white-space:nowrap;font-size:12px;background:${color}1a;color:${color};">${label}</span>`;
}

function statusBadge(st) {
    const m = { pending: ['待处理','#b45309'], approved: ['已通过','#3d5a0a'], rejected: ['已驳回','#b91c1c'],
                cancelled: ['已撤回','#71717a'], withdrawn: ['已撤回','#71717a'] };
    const [txt, c] = m[st] || [st, '#52525b'];
    return `<span style="color:${c};font-size:12px;">${txt}</span>`;
}

async function reload() {
    const body = document.getElementById('apprBody');
    body.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#a1a1aa;padding:24px;">加载中…</td></tr>';
    const url = currentTab === 'pending' ? '/api/owner-approvals/center/pending' : '/api/owner-approvals/center/mine';
    const res = await API.get(url);
    const items = (res && res.data && res.data.items) || [];
    if (!items.length) {
        body.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#a1a1aa;padding:24px;">${currentTab==='pending'?'暂无待审批事项':'你还没有发起过申请'}</td></tr>`;
        return;
    }
    body.innerHTML = items.map(it => {
        const people = currentTab === 'pending' ? escapeHtml(it.requester_name || '') : statusBadge(it.status);
        let actions = '';
        if (currentTab === 'pending') {
            if (it.kind === 'online') {
                // 上线单：会审研发按 reviewer 审；管理员按 manager 审
                if (it.can_manager) {
                    actions += `<button class="btn btn-primary btn-xs" onclick="decideOnline(${it.project_id},${it.id},'manager','approve')">通过</button>
                                <button class="btn btn-danger btn-xs" onclick="decideOnline(${it.project_id},${it.id},'manager','reject')">驳回</button>`;
                } else if (it.can_reviewer) {
                    actions += `<button class="btn btn-primary btn-xs" onclick="decideOnline(${it.project_id},${it.id},'reviewer','approve')">通过</button>
                                <button class="btn btn-danger btn-xs" onclick="decideOnline(${it.project_id},${it.id},'reviewer','reject')">驳回</button>`;
                }
            } else {
                // 责任人操作单
                actions += `<button class="btn btn-primary btn-xs" onclick="decideOwner(${it.id},'approve')">通过</button>
                            <button class="btn btn-danger btn-xs" onclick="decideOwner(${it.id},'reject')">驳回</button>`;
            }
        }
        return `<tr>
            <td>${actionBadge(it.action_label)}</td>
            <td>${escapeHtml(it.api_name || '')}</td>
            <td>${escapeHtml(it.project_name || '')}</td>
            <td>${people}</td>
            <td style="max-width:220px;color:#71717a;font-size:12px;">${escapeHtml((it.reason||it.decide_comment||'').slice(0,60))}</td>
            <td style="color:#a1a1aa;font-size:12px;">${escapeHtml(it.created_at || '')}</td>
            <td style="text-align:right;">${actions}</td>
        </tr>`;
    }).join('');
}

async function decideOwner(id, decision) {
    if (decision === 'reject' && !await confirmAsync('驳回申请', '确认驳回该申请？', { okText: '驳回' })) return;
    const ep = decision === 'approve' ? 'approve' : 'reject';
    const res = await API.post(`/api/owner-approvals/${id}/${ep}`, { comment: '' });
    if (res && res.status) { Toast.success(res.msg || '已处理'); reload(); }
    else Toast.error((res && res.msg) || '处理失败');
}

async function decideOnline(projectId, apprId, role, decision) {
    if (decision === 'reject' && !await confirmAsync('驳回上线单', '确认驳回该上线单？', { okText: '驳回' })) return;
    const res = await API.post(`/api/projects/${projectId}/approvals/${apprId}/${role}`, { decision, comment: '' });
    if (res && res.status) { Toast.success(res.msg || '已处理'); reload(); }
    else Toast.error((res && res.msg) || '处理失败');
}

document.addEventListener('DOMContentLoaded', reload);
</script>
{% endblock %}
